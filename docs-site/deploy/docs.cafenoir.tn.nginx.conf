# Private docs site: https://docs.cafenoir.tn
# Install as /etc/nginx/sites-available/docs.cafenoir.tn (symlinked from sites-enabled), then:
#   sudo nginx -t && sudo systemctl reload nginx
#
# Access is gated by nginx's `auth_request` directive on EVERY location below (the static HTML,
# but also every JS/CSS/JSON asset — a JSON search index or a page's data is content too, not just
# the page shell) — nothing is served to a request without a valid session, full stop, before a
# single byte of this site's content leaves the server. See PLAN_SITE_DOCUMENTATION_PRIVE.md at
# the repo root for the full design.
#
# The verification target is the main app's own session-check endpoint, reached over the local
# loopback (both sites run on the same host — see server/index.ts's PORT / the pm2 ecosystem
# file) rather than back out over the public internet: faster, and one less thing that has to be
# reachable from outside for this to work.
#
# This server is reached through the Cloudflare Tunnel (cloudflared), which already terminates
# TLS at Cloudflare's edge — this block is plain HTTP on the loopback, no certificate to manage
# here (see PLAN_SITE_DOCUMENTATION_PRIVE.md §2.2 and the cloudflared tunnel config on this VM).

server {
    listen 80;
    listen [::]:80;
    server_name docs.cafenoir.tn;

    # Internal-only location the auth_request subrequests below dispatch to — never reachable
    # directly (the leading "/" match still applies auth_request to requests for this path
    # itself, and `internal` additionally refuses any direct external hit with a 404).
    location = /_auth_check {
        internal;
        proxy_pass http://127.0.0.1:3011/api/auth/verify;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        # The visitor's real Cookie header is what carries the shared session — forwarded
        # automatically by proxy_pass, kept here as an explicit reminder of why this works.
        proxy_set_header Cookie $http_cookie;
    }

    # A denied auth_request (401) lands here instead of nginx's bare "401 Authorization
    # Required" — sends the visitor to log in on the main app, then back to the page they wanted.
    location @require_login {
        return 302 https://system.cafenoir.tn/?next=https://$host$request_uri;
    }

    root /var/www/CNsystemmanagement/docs-site/dist;
    index index.html;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml text/xml text/plain;

    # NB: add_header is not inherited into a location that defines its own, so each one repeats them.
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    location /assets/ {
        auth_request /_auth_check;
        error_page 401 = @require_login;
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    # SPA fallback: every other path (including deep links like /avance-ou-prime) is gated the
    # same way, then handed index.html — the React app's own router resolves the real page.
    location / {
        auth_request /_auth_check;
        error_page 401 = @require_login;
        try_files $uri /index.html;
        add_header Cache-Control "no-cache" always;
    }
}
