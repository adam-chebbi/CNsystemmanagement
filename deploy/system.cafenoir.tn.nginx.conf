# Production nginx config for the management system: https://system.cafenoir.tn
# Install as /etc/nginx/sites-available/system.cafenoir.tn (symlinked from sites-enabled), then:
#   sudo nginx -t && sudo systemctl reload nginx
#
# Reached through the Cloudflare Tunnel (cloudflared), which already terminates TLS at
# Cloudflare's edge — this block is plain HTTP on the loopback, nothing to manage here. The app
# itself (server/index.ts, via pm2 — see ecosystem.config.cjs, not tracked here since it's
# host-specific) listens on PORT 3011 and serves both the API and the built SPA (dist/).
#
# system.cafenoir.tn is also where docs.cafenoir.tn's nginx auth_request gate checks sessions
# against (GET /api/auth/verify) — see docs-site/deploy/docs.cafenoir.tn.nginx.conf and
# PLAN_SITE_DOCUMENTATION_PRIVE.md.

server {
    listen 80;
    listen [::]:80;
    server_name system.cafenoir.tn;

    location / {
        proxy_pass http://localhost:3011;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
