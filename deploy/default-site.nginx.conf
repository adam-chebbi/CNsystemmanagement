# The catch-all nginx default_server — whatever answers when a request's Host header doesn't
# match any other server_name on this machine (a bare IP hit, a stray/misconfigured DNS record,
# a scanner). Serves a small static "Under construction" holding page from /var/www/html (a
# single self-contained index.html — no build step, copy it there directly).
# Install as /etc/nginx/sites-available/default-site (symlinked from sites-enabled), then:
#   sudo nginx -t && sudo systemctl reload nginx
#
# cafenoir.tn (the apex domain) is a SEPARATE server block now — see
# ../showcase/deploy/cafenoir.tn.nginx.conf — it serves the showcase, not this holding page.

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    root /var/www/html;
    index index.html;

    location / {
        try_files $uri $uri/ =404;
    }
}
