# cafe.cafenoir.tn was the management system's hostname during the migration to this server —
# it no longer hosts the app directly (see system.cafenoir.tn.nginx.conf). Kept only as a
# redirect so any old link/bookmark still lands somewhere useful, rather than dead.
# Install as /etc/nginx/sites-available/cafe.cafenoir.tn (symlinked from sites-enabled), then:
#   sudo nginx -t && sudo systemctl reload nginx
#
# The app used to be a PWA here (service worker + offline cache — see src/pwa/updateManager.ts).
# A plain redirect alone never reaches anyone whose browser still has that old worker active
# (installed PWA, a tab left open from before the move): the worker answers every navigation
# straight from its own cache, so the request never reaches this block at all for them. The one
# exception below (serving cafe-migration/sw.js at the exact old script path) is what actually
# clears that out — see that file's own comment for the full mechanism.

server {
    listen 80;
    listen [::]:80;
    server_name cafe.cafenoir.tn;

    location = /sw.js {
        alias /var/www/CNsystemmanagement/deploy/cafe-migration/sw.js;
        default_type "application/javascript; charset=utf-8";
        add_header Cache-Control "no-cache" always;
    }

    location / {
        return 301 https://system.cafenoir.tn$request_uri;
    }
}
