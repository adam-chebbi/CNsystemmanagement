# Historique & Comptage: https://historique.cafenoir.tn
# Install as /etc/nginx/sites-available/historique.cafenoir.tn (symlinked from sites-enabled), then:
#   sudo nginx -t && sudo systemctl reload nginx
#
# Same setup as system.cafenoir.tn (../../deploy/system.cafenoir.tn.nginx.conf): reached through
# the Cloudflare Tunnel, which terminates TLS, so this block is plain HTTP on the loopback. The
# Historique process (historique/server/index.ts, via pm2) listens on PORT 3012 and serves its
# API and its built SPA (historique/dist). It calls the main app (port 3011) on the loopback
# for authentication only. See historique/README.md.
#
# Remember to add the hostname to the cloudflared tunnel ingress rules and DNS
# (historique.cafenoir.tn -> http://localhost:80).

server {
    listen 80;
    listen [::]:80;
    server_name historique.cafenoir.tn;

    # Receipt photos are resized on the phone before upload (~300 KB). The app accepts up to 8 MB.
    client_max_body_size 10m;

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # The service worker and manifest must never be cached by the browser, or a new build would
    # take days to reach the installed PWAs.
    location = /sw.js {
        proxy_pass http://localhost:3012;
        proxy_set_header Host $host;
        add_header Cache-Control "no-cache" always;
    }

    location / {
        proxy_pass http://localhost:3012;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
