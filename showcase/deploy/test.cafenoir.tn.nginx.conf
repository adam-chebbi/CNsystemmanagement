# Production nginx config for the customer-facing menu: https://test.cafenoir.tn
# Install as /etc/nginx/sites-available/test.cafenoir.tn (symlinked from sites-enabled), then:
#   sudo nginx -t && sudo systemctl reload nginx
#
# The site is a static single-page app (showcase/dist). It reads the catalogue in the visitor's
# browser from https://cafe.cafenoir.tn/api/products — a public, read-only, CORS-open route of the
# management system — so nothing here proxies to, or shares anything with, the system's Node process.
# The certificate is the Let's Encrypt one already issued for this name (no secret lives in this file).

server {
    listen 80;
    listen [::]:80;
    server_name test.cafenoir.tn;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name test.cafenoir.tn;

    ssl_certificate /etc/letsencrypt/live/test.cafenoir.tn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/test.cafenoir.tn/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # Only the build output is exposed — never the repository around it.
    root /var/www/CNsystemmanagement/showcase/dist;
    index index.html;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # NB: add_header is not inherited into a location that defines its own, so each one repeats them.

    # Vite build assets are content-hashed: safe to cache for a year.
    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    # Photos keep their file name when replaced, so they must not be cached "forever".
    location /images/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=86400" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    location = /favicon.svg {
        add_header Cache-Control "public, max-age=86400" always;
    }

    # The two pages are static files generated by the build, each with its own <head> (title,
    # description, canonical, Open Graph, JSON-LD): / -> index.html and /menu -> menu/index.html.
    # Never cached, so a new build is picked up on the next visit.
    location = / {
        try_files /index.html =404;
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
    }

    location ~ ^/menu/?$ {
        try_files /menu/index.html =404;
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
    }

    # Root files (robots.txt, sitemap.xml, llms.txt, manifest, icons). Any other address is a real
    # HTTP 404 that still shows the app's "page introuvable" screen (it is also marked noindex), so
    # search engines never index made-up URLs as copies of the home page.
    location / {
        try_files $uri =404;
        error_page 404 =404 /index.html;
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
    }
}
