# test.cafenoir.tn was the showcase's original address before the apex domain (cafenoir.tn) was
# freed up for it — see deploy/cafenoir.tn.nginx.conf. Kept only as a redirect so any old
# link/bookmark still lands on the real site, rather than dead or duplicating its content.
# Install as /etc/nginx/sites-available/test.cafenoir.tn (symlinked from sites-enabled), then:
#   sudo nginx -t && sudo systemctl reload nginx

server {
    listen 80;
    listen [::]:80;
    server_name test.cafenoir.tn;

    return 301 https://cafenoir.tn$request_uri;
}
