# Production nginx config for the customer-facing menu/showcase: https://cafenoir.tn
# Install as /etc/nginx/sites-available/cafenoir.tn (symlinked from sites-enabled), then:
#   sudo nginx -t && sudo systemctl reload nginx
#
# The site is a static single-page app (showcase/dist). It reads the catalogue in the visitor's
# browser from https://system.cafenoir.tn/api/products — a public, read-only, CORS-open route of
# the management system — so nothing here proxies to, or shares anything with, the system's Node
# process. Reached through the Cloudflare Tunnel (cloudflared), which already terminates TLS at
# Cloudflare's edge — no local certificate to manage.
#
# www.cafenoir.tn redirects here; cafe.cafenoir.tn and test.cafenoir.tn (this site's previous
# addresses, from before the apex domain was freed up for it) redirect here too — see
# deploy/cafe.cafenoir.tn.nginx.conf and deploy/test.cafenoir.tn.nginx.conf at the repo root.
#
# The apex itself used to host the management app (before it moved away, first to cafe.cafenoir.tn
# then to system.cafenoir.tn — see deploy/cafe-migration/sw.js at the repo root for that leg of the
# story). Anyone whose browser still has that old app's service worker active here gets served the
# stale cached app instead of this site, and that old app then redirects them on to
# system.cafenoir.tn — from the outside this looks like "cafenoir.tn redirects to system.cafenoir.tn",
# even though this server never sends any such redirect. The location block below (serving
# deploy/cafenoir-apex-migration/sw.js) is the fix — see that file's own comment for the mechanism.

server {
    listen 80;
    listen [::]:80;
    server_name www.cafenoir.tn;

    return 301 https://cafenoir.tn$request_uri;
}

server {
    listen 80;
    listen [::]:80;
    server_name cafenoir.tn;

    root /var/www/CNsystemmanagement/showcase/dist;
    index index.html;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json application/manifest+json image/svg+xml text/xml text/plain;

    # NB: add_header is not inherited into a location that defines its own, so each one repeats them.

    # Vite build assets are content-hashed: safe to cache for a year.
    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    # Photos keep their file name when replaced, so they must not be cached "forever".
    location /images/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=86400" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    location = /favicon.svg {
        add_header Cache-Control "public, max-age=86400" always;
    }

    # Kill-switch for the app's old service worker (see the comment at the top of this file and
    # in the script itself) — takes priority over the generic "/" location below regardless of
    # declaration order, since nginx always matches an exact "location =" first.
    location = /sw.js {
        alias /var/www/CNsystemmanagement/deploy/cafenoir-apex-migration/sw.js;
        default_type "application/javascript; charset=utf-8";
        add_header Cache-Control "no-cache" always;
    }

    # This server's MIME table has no entry for .webmanifest (it would go out as octet-stream).
    location = /manifest.webmanifest {
        default_type application/manifest+json;
        add_header Cache-Control "public, max-age=86400" always;
    }

    # The two pages are static files generated by the build, each with its own <head> (title,
    # description, canonical, Open Graph, JSON-LD): / -> index.html and /menu -> menu/index.html.
    # Never cached, so a new build is picked up on the next visit.
    location = / {
        try_files /index.html =404;
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
    }

    location ~ ^/menu/?$ {
        try_files /menu/index.html =404;
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
    }

    # Root files (robots.txt, sitemap.xml, llms.txt, manifest, icons). Any other address is a real
    # HTTP 404 that still shows the app's "page introuvable" screen (it is also marked noindex), so
    # search engines never index made-up URLs as copies of the home page.
    location / {
        try_files $uri =404;
        error_page 404 =404 /index.html;
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
    }
}
