<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Café Noir — Café · Brunch · Pâtisserie à Tunis</title>
    <meta name="description" content="Plus qu'un café, une expérience. Au cœur de Tunis, Café Noir vous invite à savourer des cafés d'exception, des pâtisseries artisanales et une ambiance unique, entre modernité et tradition." />
    <meta property="og:title" content="Café Noir — Plus qu'un café, une expérience" />
    <meta property="og:description" content="Cafés d'exception, pâtisseries artisanales et ambiance unique au cœur de Tunis. Découvrez notre menu." />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="/images/hero.jpg" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="theme-color" content="#FAF9F5" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;1,6..72,400&display=swap"
      rel="stylesheet"
    />
    <link rel="preload" as="image" href="/images/hero.jpg" />
    <script>
      // Applies the saved (or OS-preferred) theme before first paint so there is no light→dark flash.
      (function () {
        try {
          var saved = localStorage.getItem('cafenoir-showcase-theme');
          var dark = saved ? saved === 'dark' : window.matchMedia('(prefers-color-scheme: dark)').matches;
          var root = document.documentElement;
          root.classList.toggle('dark', dark);
          root.style.colorScheme = dark ? 'dark' : 'light';
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
